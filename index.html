<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>NRZ | STORE</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<!-- FontAwesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

<!-- ZapPay Payment Gateway -->
<script src="https://zappay.shop/zappay-pay.js"></script>

<style>
    /* ============================================
       ROOT VARIABLES & RESET
    ============================================ */
    :root {
        --bg-primary: #08090d;
        --bg-secondary: #0e1016;
        --bg-card: #141820;
        --bg-card-hover: #1a1f2a;
        --bg-input: #0c0f15;
        --border-color: #252b3a;
        --border-light: #333a4d;
        --text-primary: #eef2f8;
        --text-secondary: #8892a8;
        --text-muted: #4a5266;
        --accent-blue: #4f8cff;
        --accent-cyan: #00d4ff;
        --accent-purple: #8b5cf6;
        --accent-pink: #ec4899;
        --accent-gold: #fbbf24;
        --accent-green: #34d399;
        --accent-red: #f87171;
        --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.5);
        --shadow-glow: 0 0 40px rgba(79, 140, 255, 0.15);
        --radius: 16px;
        --radius-sm: 10px;
        --radius-lg: 24px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --security-bg: rgba(0,0,0,0.92);
        --security-border: rgba(79,140,255,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        scroll-behavior: smooth;
    }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; }
    input, select, textarea {
        font-family: inherit;
        outline: none;
        background: none;
        border: none;
        color: var(--text-primary);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

    .hidden { display: none !important; }

    /* ============================================
       LOADER
    ============================================ */
    #loader {
        position: fixed;
        inset: 0;
        background: var(--bg-primary);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
    }
    #loader .spinner-ring {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 3px solid var(--border-color);
        border-top-color: var(--accent-blue);
        animation: spin 0.8s cubic-bezier(0.6, 0, 0.4, 1) infinite;
        box-shadow: 0 0 30px rgba(79, 140, 255, 0.1);
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    #loader .loader-text {
        font-weight: 600;
        font-size: 14px;
        color: var(--text-secondary);
        letter-spacing: 3px;
        text-transform: uppercase;
    }
    #loader .loader-dots {
        display: flex;
        gap: 8px;
    }
    #loader .loader-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-blue);
        animation: dotPulse 1.4s ease-in-out infinite;
    }
    #loader .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
    #loader .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1); }
    }

    /* ============================================
       SECURITY OVERLAY - ENHANCED
    ============================================ */
    #security-overlay {
        position: fixed;
        inset: 0;
        background: var(--security-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        z-index: 99998;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 24px;
        transition: opacity 0.5s ease, visibility 0.5s ease;
        opacity: 0;
        visibility: hidden;
        padding: 24px;
    }
    #security-overlay.active {
        opacity: 1;
        visibility: visible;
    }
    #security-overlay .shield-icon {
        font-size: 64px;
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; }
    }
    #security-overlay .security-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 1px;
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    #security-overlay .security-progress {
        width: 200px;
        height: 4px;
        background: var(--border-color);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
    }
    #security-overlay .security-progress .bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
        border-radius: 10px;
        transition: width 0.3s ease;
    }
    #security-overlay .security-status {
        font-size: 14px;
        color: var(--text-secondary);
        letter-spacing: 0.5px;
        font-weight: 500;
    }
    #security-overlay .security-dots {
        display: flex;
        gap: 12px;
        margin-top: 8px;
    }
    #security-overlay .security-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--border-color);
        transition: background 0.3s ease;
    }
    #security-overlay .security-dots span.active {
        background: var(--accent-blue);
        box-shadow: 0 0 12px rgba(79, 140, 255, 0.4);
    }
    #security-overlay .security-dots span.done {
        background: var(--accent-green);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.3);
    }
    #security-overlay .security-checkmark {
        font-size: 48px;
        color: var(--accent-green);
        display: none;
        animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    /* ============================================
       TOAST
    ============================================ */
    #toast-container {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 90%;
        max-width: 440px;
        pointer-events: none;
    }
    .toast {
        padding: 16px 20px;
        border-radius: var(--radius-sm);
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: auto;
        animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: var(--shadow-card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }
    .toast.success { border-left: 4px solid var(--accent-green); }
    .toast.error { border-left: 4px solid var(--accent-red); }
    .toast.warning { border-left: 4px solid var(--accent-gold); }
    .toast i { font-size: 18px; }
    .toast.success i { color: var(--accent-green); }
    .toast.error i { color: var(--accent-red); }
    .toast.warning i { color: var(--accent-gold); }
    @keyframes toastIn {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============================================
       AUTH SCREEN - MODERN & CLEAN
    ============================================ */
    #auth-screen {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg-primary);
        position: relative;
        overflow: hidden;
    }
    #auth-screen::before {
        content: '';
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(79, 140, 255, 0.06), transparent 70%);
        top: -200px;
        right: -200px;
        pointer-events: none;
    }
    #auth-screen::after {
        content: '';
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.05), transparent 70%);
        bottom: -200px;
        left: -200px;
        pointer-events: none;
    }
    .auth-container {
        width: 100%;
        max-width: 420px;
        position: relative;
        z-index: 1;
    }
    .auth-card {
        background:
            linear-gradient(135deg, rgba(255,255,255,.105), rgba(255,255,255,.035) 48%, rgba(79,140,255,.035));
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 28px;
        padding: 44px 36px 36px;
        box-shadow:
            0 24px 70px rgba(0,0,0,.42),
            inset 0 1px 0 rgba(255,255,255,.18),
            inset 0 -1px 0 rgba(255,255,255,.035),
            0 0 0 1px rgba(79,140,255,.035);
        backdrop-filter: blur(24px) saturate(145%);
        -webkit-backdrop-filter: blur(24px) saturate(145%);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
        isolation: isolate;
    }
    .auth-card::after {
        content: '';
        position: absolute;
        inset: 1px;
        border-radius: 27px;
        background:
            radial-gradient(circle at 12% 8%, rgba(255,255,255,.13), transparent 26%),
            linear-gradient(120deg, rgba(255,255,255,.045), transparent 42%, rgba(139,92,246,.045));
        pointer-events: none;
        z-index: -1;
    }
    .auth-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
        opacity: 0.6;
    }
    .auth-card:hover { border-color: var(--border-light); }
    .auth-card .brand {
        text-align: center;
        margin-bottom: 32px;
    }
    .auth-card .brand .logo-icon {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px;
        font-size: 24px;
        font-weight: 900;
        color: #fff;
        box-shadow: 0 8px 24px rgba(79, 140, 255, 0.3);
        overflow: hidden;
    }
    .auth-card .brand .logo-icon img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        border-radius: inherit;
    }
    .auth-card .brand h1 {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.5px;
    }
    .auth-card .brand h1 span { 
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .auth-card .brand p {
        color: var(--text-secondary);
        font-size: 14px;
        margin-top: 4px;
        font-weight: 400;
    }
    .auth-card .input-group {
        margin-bottom: 16px;
        position: relative;
    }
    .auth-card .input-group .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 15px;
        transition: var(--transition);
        pointer-events: none;
    }
    .auth-card .input-group input {
        width: 100%;
        padding: 14px 18px 14px 44px;
        background: var(--bg-input);
        border: 1.5px solid var(--border-color);
        border-radius: var(--radius-sm);
        font-size: 14px;
        transition: var(--transition);
        color: var(--text-primary);
    }
    .auth-card .input-group input:focus {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 4px rgba(79, 140, 255, 0.08);
    }
    .auth-card .input-group input:focus + .input-icon,
    .auth-card .input-group input:focus ~ .input-icon {
        color: var(--accent-blue);
    }
    .auth-card .input-group input::placeholder { color: var(--text-muted); }

    .btn-auth {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
        border: none;
        border-radius: var(--radius-sm);
        font-weight: 700;
        font-size: 15px;
        color: #fff;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 4px;
        position: relative;
        overflow: hidden;
    }
    .btn-auth::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
        opacity: 0;
        transition: var(--transition);
    }
    .btn-auth:hover::before { opacity: 1; }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(79, 140, 255, 0.3); }
    .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-auth span { position: relative; z-index: 1; }
    .btn-auth i { position: relative; z-index: 1; }

    .auth-toggle {
        margin-top: 20px;
        text-align: center;
        color: var(--text-secondary);
        font-size: 14px;
    }
    .auth-toggle span {
        color: var(--accent-blue);
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
    }
    .auth-toggle span:hover { color: var(--accent-purple); }

    .auth-divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 24px 0 16px;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    .auth-divider::before,
    .auth-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border-color);
    }

    .social-row {
        display: flex;
        gap: 10px;
    }
    .social-row .social-btn {
        flex: 1;
        padding: 12px;
        border: 1.5px solid var(--border-color);
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-secondary);
        font-weight: 500;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition);
        text-decoration: none;
    }
    .social-row .social-btn:hover {
        border-color: var(--border-light);
        color: var(--text-primary);
        background: var(--bg-input);
    }
    .social-row .social-btn.wa:hover { border-color: #25D366; color: #25D366; }
    .social-row .social-btn.tg:hover { border-color: #0088cc; color: #0088cc; }

    /* ============================================
       MAIN APP
    ============================================ */
    #main-app { display: block; }

    /* NAVBAR - Sleek & Modern */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 72px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(8, 9, 13, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border-color);
        z-index: 1000;
        transition: var(--transition);
    }
    .navbar .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.5px;
    }
    .navbar .brand .brand-icon {
        width: 34px;
        height: 34px;
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #fff;
        font-weight: 900;
    }
    .navbar .brand span { 
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .navbar .brand img { height: 32px; border-radius: 6px; }
    .panel-heading-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
    .panel-logo { width:48px; height:48px; border-radius:13px; object-fit:cover; flex:0 0 48px; border:1px solid var(--border); background:var(--surface-2); }
    .panel-heading-row .panel-name { margin-bottom:0; }
    .panel-heading-row .panel-category { margin-top:4px; color:var(--text-primary); font-size:12px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; }
    .navbar .nav-actions {
        display: flex;
        align-items: center;
        gap: 14px;
    }
    .navbar .balance-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 18px;
        background: rgba(79, 140, 255, 0.08);
        border: 1px solid rgba(79, 140, 255, 0.15);
        border-radius: 30px;
        font-weight: 700;
        font-size: 14px;
        color: var(--accent-blue);
        transition: var(--transition);
    }
    .navbar .balance-pill:hover { border-color: rgba(79, 140, 255, 0.3); }
    .navbar .balance-pill i { font-size: 14px; }
    .navbar .menu-btn {
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-size: 18px;
        transition: var(--transition);
    }
    .navbar .menu-btn:hover { border-color: var(--border-light); background: var(--bg-card-hover); }

    /* DROPDOWN */
    .dropdown {
        position: absolute;
        top: 80px;
        right: 28px;
        width: 230px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 8px;
        box-shadow: var(--shadow-card);
        transform-origin: top right;
        transform: scale(0.95);
        opacity: 0;
        visibility: hidden;
        transition: var(--transition);
        z-index: 999;
    }
    .dropdown.active {
        transform: scale(1);
        opacity: 1;
        visibility: visible;
    }
    .dropdown-item {
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
        transition: var(--transition);
        cursor: pointer;
    }
    .dropdown-item:hover {
        background: var(--bg-input);
        color: var(--text-primary);
    }
    .dropdown-item i { width: 20px; font-size: 15px; color: var(--text-muted); }
    .dropdown-item:hover i { color: var(--accent-blue); }
    .dropdown-item.danger { color: var(--accent-red); }
    .dropdown-item.danger:hover { background: rgba(248, 113, 113, 0.08); }
    .dropdown-item.danger i { color: var(--accent-red); }
    .dropdown-divider {
        height: 1px;
        background: var(--border-color);
        margin: 6px 0;
    }

    /* ============================================
       PAGE CONTENT
    ============================================ */
    .page-content {
        padding: 92px 28px 80px;
        max-width: 1200px;
        margin: 0 auto;
        animation: fadeUp 0.5s ease;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .page-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 32px;
    }
    .page-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
    }
    .page-title span { 
        background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .search-box {
        position: relative;
        flex: 1;
        min-width: 200px;
        max-width: 380px;
    }
    .search-box input {
        width: 100%;
        padding: 12px 18px 12px 44px;
        background: var(--bg-input);
        border: 1.5px solid var(--border-color);
        border-radius: 30px;
        font-size: 14px;
        transition: var(--transition);
        color: var(--text-primary);
    }
    .search-box input:focus {
        border-color: var(--accent-purple);
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.06);
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box .search-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 16px;
        pointer-events: none;
    }
    .search-box .search-spinner {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--accent-purple);
        display: none;
        animation: spin 0.8s linear infinite;
    }

    /* ============================================
       PROMO SLIDER
    ============================================ */
    .promo-slider {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        padding-bottom: 12px;
        margin-bottom: 32px;
        scroll-snap-type: x mandatory;
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    .promo-slider::-webkit-scrollbar { display: none; }
    .promo-slider .promo-card {

    // --- STATE ---

    // --- SECURITY SYSTEM ---
    function runSecurityCheck() {
        return new Promise((resolve) => {
            securityOverlay.classList.add('active');
            const bar = document.getElementById('security-bar');
            const status = document.getElementById('security-status');
            const dots = [
                document.getElementById('dot1'),
                document.getElementById('dot2'),
                document.getElementById('dot3'),
                document.getElementById('dot4')
            ];
            const checkmark = document.getElementById('security-check');

            // Reset UI
            bar.style.width = '0%';
            dots.forEach(d => { d.className = ''; });
            checkmark.style.display = 'none';
            status.textContent = 'Initializing security protocols...';

            const steps = [
                { text: 'Verifying SSL encryption...', progress: 25 },
                { text: 'Checking session integrity...', progress: 50 },
                { text: 'Validating user permissions...', progress: 75 },
                { text: 'Secure connection established!', progress: 100 }
            ];

            let stepIndex = 0;

            function advanceStep() {
                if (stepIndex >= steps.length) {
                    // Complete
                    status.textContent = '✅ Security check complete!';
                    dots.forEach(d => d.className = 'done');
                    checkmark.style.display = 'block';
                    setTimeout(() => {
                        securityOverlay.classList.remove('active');
                        resolve();
                    }, 800);
                    return;
                }

                const step = steps[stepIndex];
                status.textContent = step.text;
                bar.style.width = step.progress + '%';

                // Update dots
                if (stepIndex < dots.length) {
                    dots[stepIndex].className = 'active';
                }

                stepIndex++;
                setTimeout(advanceStep, 700);
            }

            // Start the sequence
            setTimeout(advanceStep, 400);
        });
    }

    // Run security check on app load
    async function performSecurityCheck() {
        if (securityCompleted) {
            try { securityOverlay?.classList.remove('active'); } catch (_) {}
            return;
        }
        securityCompleted = true;
        try {
            // Cosmetic only: NEVER block authentication or dashboard rendering.
            const securityPromise = runSecurityCheck();
            await Promise.race([
                securityPromise,
                new Promise(resolve => setTimeout(resolve, 2500))
            ]);
        } catch (e) {
            console.warn('Security check skipped:', e);
        } finally {
            // Critical: if the animation times out, its overlay must still disappear.
            try { securityOverlay?.classList.remove('active'); } catch (_) {}
        }
    }

    // --- UTILITIES ---
    window.showLoader = () => loader.classList.remove('hidden');
    window.hideLoader = () => loader.classList.add('hidden');

    window.showToast = (msg, type = 'success') => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icon = type === 'error' ? 'fa-exclamation-circle' : type === 'warning' ? 'fa-exclamation-triangle' : 'fa-check-circle';
        toast.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(10px)';
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    };

    window.copyToClipboard = (elementId, label) => {
        const el = document.getElementById(elementId);
        if (!el) {
            showToast("Element not found", "error");
            return;
        }
        const text = el.innerText || el.textContent;
        if (!text || text === 'Loading...' || text === 'XXXXXX' || text === 'Not Set' || text === '...') {
            showToast("Nothing to copy", "warning");
            return;
        }
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`${label || 'Text'} copied!`, "success");
            }).catch(() => {
                fallbackCopy(text, label);
            });
        } else {
            fallbackCopy(text, label);
        }
    };

    function fallbackCopy(text, label) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showToast(`${label || 'Text'} copied!`, "success");
        } catch (e) {
            showToast("Failed to copy. Please copy manually.", "error");
        }
        document.body.removeChild(textarea);
    }

    window.closeModal = (id) => {
        const modal = document.getElementById(id);
        if (modal) modal.classList.add('hidden');
    };
    
    window.openModal = (id) => {
        const modal = document.getElementById(id);
        if (modal) modal.classList.remove('hidden');
    };

    function generateKey(length = 12) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < length; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
        return result;
    }

    function extractYouTubeID(url) {
        if (!url) return null;
        url = String(url).trim();
        if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
        const match = url.match(/^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    // --- ZAPPAY PAYMENT SYSTEM ---
    const ZAPPAY_API_BASE = "https://zappay-beta.vercel.app";
    let paymentPollInterval = null;
    let activePaymentWindow = null;

    function sanitizeAmount(value) {
        const n = Number(String(value).replace(/[^0-9.]/g, ''));
        return Number.isFinite(n) ? Math.floor(n * 100) / 100 : NaN;
    }

    async function zapPayCreateOrder(amount, title) {
        const key = String(window.ZAP_KEY || '').trim();
        const response = await fetch(`${ZAPPAY_API_BASE}/api/developer/create-order`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-ZapAPI-Key': key },
            body: JSON.stringify({
                amount,
                title: title || 'Wallet Deposit',
                useEmbedded: true
            })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) {
            const msg = data.message || (Array.isArray(data.errors) ? data.errors.join(', ') : 'Unable to create payment order');
            throw new Error(msg);
        }
        return data.data;
    }

    async function zapPayGetStatus(orderId) {
        const key = String(window.ZAP_KEY || '').trim();
        const response = await fetch(
            `${ZAPPAY_API_BASE}/api/developer/order-status/${encodeURIComponent(orderId)}`,
            { headers: { 'X-ZapAPI-Key': key } }
        );
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) throw new Error(data.message || 'Unable to fetch order status');
        return data.data;
    }

    async function processSuccessfulPayment(orderId, gatewayData) {
        if (!currentUser || !gatewayData) return;
        const amount = Number(gatewayData.amount);
        if (!Number.isFinite(amount) || amount < 1 || amount > 5000) return;

        const txRef = ref(db, `transactions/${currentUser.uid}/${orderId}`);
        try {
            const result = await runTransaction(txRef, (tx) => {
                if (tx && tx.status === "pending") {
                    tx.status = "success";
                    tx.gateway_status = "success";
                    tx.date = new Date().toISOString();
                    return tx;
                }
                return undefined;
            });

            if (result.committed) {
                await runTransaction(ref(db, `users/${currentUser.uid}/balance`), (bal) => (Number(bal) || 0) + amount);
                await update(ref(db, `gateway_payments/${orderId}`), {
                    status: "approved",
                    gateway_status: "success",
                    verified_amount: amount,
                    verified_at: new Date().toISOString()
                });
                showToast(`Added ₹${amount.toFixed(2)} to wallet!`, "success");
                if (typeof updateWalletStats === 'function') updateWalletStats();
            }
        } catch (e) {
            console.error("Process payment error:", e);
            showToast("Payment verified, but wallet update failed. Contact admin.", "error");
        }
    }

    async function verifyZapPayOrder(orderId) {
        try {
            const data = await zapPayGetStatus(orderId);
            if (data.status === "success") {
                clearInterval(paymentPollInterval);
                localStorage.removeItem("pending_zap_order");
                localStorage.removeItem("pending_zap_time");
                if (activePaymentWindow && !activePaymentWindow.closed) activePaymentWindow.close();
                await processSuccessfulPayment(orderId, data);
                return true;
            }

            if (data.status === "failed") {
                clearInterval(paymentPollInterval);
                localStorage.removeItem("pending_zap_order");
                localStorage.removeItem("pending_zap_time");
                if (activePaymentWindow && !activePaymentWindow.closed) activePaymentWindow.close();
                await updatePaymentStatus(orderId, "failed");
                showToast("Payment failed. Order: " + orderId, "error");
                return true;
            }
        } catch (e) {
            console.log("ZapPay verification error:", e);
        }
        return false;
    }

    function startPaymentWatcher(orderId) {
        if (paymentPollInterval) clearInterval(paymentPollInterval);
        localStorage.setItem("pending_zap_order", orderId);
        localStorage.setItem("pending_zap_time", Date.now());

        verifyZapPayOrder(orderId);
        paymentPollInterval = setInterval(async () => {
            const started = Number(localStorage.getItem("pending_zap_time") || Date.now());
            if (Date.now() - started > 120000) {
                clearInterval(paymentPollInterval);
                localStorage.removeItem("pending_zap_order");
                localStorage.removeItem("pending_zap_time");
                showToast("Payment verification timed out. You can check the order status again.", "warning");
                return;

    // --- DIRECT PURCHASE / ZAPPAY ---
    function validatePurchaseTarget(value) {
        const target = String(value || '').trim();
        return target.length >= 5 && target.length <= 120 ? target : null;

    async function processSuccessfulPurchase(orderId, gatewayData) {
        if (!gatewayData) return;
        const amount = Number(gatewayData.amount);
        if (!Number.isFinite(amount) || amount < 1 || amount > 5000) return;

        const paymentRef = ref(db, `gateway_payments/${orderId}`);
        try {
            const result = await runTransaction(paymentRef, (payment) => {
                if (payment && payment.status === 'pending' && payment.type === 'purchase') {
                    payment.status = 'approved';
                    payment.gateway_status = 'success';
                    payment.verified_amount = amount;
                    payment.txn_id = gatewayData.txn_id || gatewayData.transaction_id || '';
                    payment.utr = gatewayData.utr || '';
                    payment.verified_at = new Date().toISOString();
                    return payment;
                }
                return undefined;
            });

            if (!result.committed) return;

            const payment = result.snapshot.val() || gatewayData;
            const newKey = generateKey(12);
            const purchaseRef = ref(db, `purchases/${orderId}`);
            const purchaseSnap = await get(purchaseRef);
            if (purchaseSnap.exists() && purchaseSnap.val()?.status === 'paid') {
                closeModal('modal-checkout');
                openModal('modal-success');
                return;
            }

            await update(purchaseRef, {
                status: 'paid',
                key: newKey,
                gatewayOrderId: orderId,
                gatewayStatus: 'success',
                txnId: gatewayData.txn_id || gatewayData.transaction_id || '',
                utr: gatewayData.utr || '',
                paidAmount: amount,
                paidAt: new Date().toISOString()
            });

            if (payment.couponId) {
                await runTransaction(ref(db, `coupons/${payment.couponId}/used`), curr => (curr || 0) + 1);
            }

            document.getElementById('modal-success')?.querySelector('.success-order-message')?.replaceChildren(
                document.createTextNode('We have received your order, processing will be start shortly.')
            );
            closeModal('modal-checkout');
            openModal('modal-success');
        } catch (e) {
            console.error('Process purchase payment error:', e);
            showToast('Payment verified, but order update failed. Please contact support.', 'error');
        }
    }

    async function updatePaymentStatus(orderId, newStatus) {
        try {
            await update(ref(db, `gateway_payments/${orderId}`), { status: newStatus });
            await update(ref(db, `purchases/${orderId}`), { status: newStatus === 'failed' ? 'payment_failed' : newStatus });
        } catch (e) { console.error(e); }
    }

    async function verifyZapPayOrder(orderId) {
        try {
            const data = await zapPayGetStatus(orderId);
            if (data.status === 'success') {
                clearInterval(paymentPollInterval);
                localStorage.removeItem('pending_zap_order');
                localStorage.removeItem('pending_zap_time');
                if (activePaymentWindow && !activePaymentWindow.closed) activePaymentWindow.close();

                const paymentSnap = await get(ref(db, `gateway_payments/${orderId}`));
                const payment = paymentSnap.val() || {};
                if (payment.type === 'purchase') await processSuccessfulPurchase(orderId, data);
                return true;
            }
            if (data.status === 'failed') {
                clearInterval(paymentPollInterval);
                localStorage.removeItem('pending_zap_order');
                localStorage.removeItem('pending_zap_time');
                if (activePaymentWindow && !activePaymentWindow.closed) activePaymentWindow.close();
                await updatePaymentStatus(orderId, 'failed');
                showToast('Payment failed. Order: ' + orderId, 'error');
                return true;
            }
        } catch (e) {
            console.log('ZapPay verification error:', e);
        }
        return false;
    }

    function startPaymentWatcher(orderId) {
        if (paymentPollInterval) clearInterval(paymentPollInterval);
        localStorage.setItem('pending_zap_order', orderId);
        localStorage.setItem('pending_zap_time', Date.now());
        verifyZapPayOrder(orderId);
        paymentPollInterval = setInterval(async () => {
            const started = Number(localStorage.getItem('pending_zap_time') || Date.now());
            if (Date.now() - started > 120000) {
                clearInterval(paymentPollInterval);
                localStorage.removeItem('pending_zap_order');
                localStorage.removeItem('pending_zap_time');
                showToast('Payment verification timed out. Your order is still saved for admin review.', 'warning');
                return;
            }
            await verifyZapPayOrder(orderId);
        }, 2500);
    }

    window.executePurchase = async function() {
        const checkout = window.currentCheckout || {};
        const target = validatePurchaseTarget(document.getElementById('chk-uid-input')?.value);
        if (!target) return showToast('Enter a valid UID / Map Code with minimum 5 characters.', 'warning');
        const price = Number(checkout.finalPrice || 0);
        if (!Number.isFinite(price) || price < 1 || price > 5000) return showToast('Invalid plan price.', 'error');
        if (!window.ZAP_KEY) return showToast('Payment gateway is offline. Please contact support.', 'error');

        const btn = document.getElementById('btn-confirm-pay');
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Creating Payment...`;
        showLoader();

        try {
            await authReady;
            const order = await zapPayCreateOrder(price, `NRZ STORE - ${checkout.panelName || 'Plan'}`);
            const orderId = order.order_id;
            if (!orderId || !order.payment_url) throw new Error('Invalid payment gateway response');

            const purchaseData = {
                panelId: checkout.panelId || '',
                panelName: checkout.panelName || 'Panel',
                plan: checkout.planKey || '',
                label: checkout.label || 'Plan',
                enteredUid: target,
                targetId: target,
                price,
                originalPrice: Number(checkout.originalPrice || price),
                status: 'pending_payment',
                gateway: 'ZapPay',
                gatewayOrderId: orderId,
                couponId: window.appliedCoupon?.id || '',
                date: new Date().toISOString()
            };

            await set(ref(db, `purchases/${orderId}`), purchaseData);
            await set(ref(db, `gateway_payments/${orderId}`), {
                type: 'purchase',
                orderId,
                targetId: target,
                enteredUid: target,
                panelId: purchaseData.panelId,
                panelName: purchaseData.panelName,
                plan: purchaseData.plan,
                label: purchaseData.label,
                amount: price,
                originalAmount: purchaseData.originalPrice,
                couponId: purchaseData.couponId,
                status: 'pending',
                gateway: 'ZapPay',
                timestamp: serverTimestamp()
            });

            activePaymentWindow = window.open(order.payment_url, 'zappay_checkout', 'width=430,height=700,resizable=yes,scrollbars=yes');
            if (!activePaymentWindow) {
                window.location.href = order.payment_url;
                return;
            }

            startPaymentWatcher(orderId);
            closeModal('modal-checkout');
            showToast(`Payment order ${orderId} created. Complete the UPI payment.`, 'success');
        } catch (e) {
            console.error('Purchase payment error:', e);
            showToast('Gateway error: ' + e.message, 'error');
        } finally {
            hideLoader();
            btn.disabled = false;
            btn.innerHTML = 'Confirm Payment';
        }
    };

    // --- MY PLANS ---
    function parsePlanDate(value) {
        if (!value) return null;
        const raw = String(value);
        const d = new Date(raw.length === 10 ? raw + 'T00:00:00' : raw);
        return Number.isNaN(d.getTime()) ? null : d;
    }

    function calculatePlanDaysLeft(plan) {
        const start = parsePlanDate(plan?.startDate);
        const end = parsePlanDate(plan?.endDate);
        if (!start || !end) return 0;
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const startDay = new Date(start.getFullYear(), start.getMonth(), start.getDate());
        const endDay = new Date(end.getFullYear(), end.getMonth(), end.getDate());
        if (today < startDay || today >= endDay) return 0;
        return Math.max(0, Math.ceil((endDay - today) / 86400000));
    }

    function getPlanDaysLeft(plan) {
        if (plan?.daysLeft !== undefined && plan?.daysLeft !== null && plan?.daysLeft !== '' && !Number.isNaN(Number(plan.daysLeft))) {
            return Math.max(0, Number(plan.daysLeft));
        }
        return calculatePlanDaysLeft(plan);
    }

    function formatPlanDate(value) {
        const d = parsePlanDate(value);
        return d ? d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : '-';
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[ch]));
    }

    // Free Fire color-code support: [ff0000]Red Text
    // A color code applies until another [RRGGBB] code is found.
    function ffColorText(value) {
        const text = String(value ?? '');
        const colorRe = /\[([0-9a-fA-F]{6})\]/g;
        let html = '';
        let last = 0;
        let currentColor = null;
        let match;

        while ((match = colorRe.exec(text)) !== null) {
            const before = text.slice(last, match.index);
            if (before) {
                const safe = escapeHtml(before);
                html += currentColor
                    ? `<span class="ff-color" style="color:#${currentColor}">${safe}</span>`
                    : safe;
            }
            currentColor = match[1];
            last = match.index + match[0].length;
        }

        const rest = text.slice(last);
        if (rest) {
            const safe = escapeHtml(rest);
            html += currentColor
                ? `<span class="ff-color" style="color:#${currentColor}">${safe}</span>`
                : safe;
        }
        return html;
    }

    function renderMyPlan(plan) {
        const container=document.getElementById('my-plan-container');
        if(!container) return;
        const active=String(plan?.status||'').toLowerCase()==='active';
        if(!plan || !active){
            container.innerHTML='<div class="plans-empty"><i class="fas fa-calendar-xmark"></i><h3>No Active Plan</h3><p>Admin ne abhi aapke account par koi plan assign nahi kiya hai.</p></div>';
            return;
        }
        const daysLeft=getPlanDaysLeft(plan);
        const planName=escapeHtml(plan.name||plan.planName||'Premium Plan');
        const uid=escapeHtml(plan.uid||currentUser?.uid||'-');
        const likes=Number(plan.likesPerDay||0);
        container.innerHTML=`
            <div class="plan-details-card">
                <div class="plan-details-head"><div class="plan-details-title"><i class="far fa-circle-check"></i><span>PLAN DETAILS</span></div><span class="plan-status"><span class="plan-status-dot"></span>Active</span></div>
                <div class="plan-field-grid">
                    <div class="plan-field wide"><span class="plan-field-label">Plan Name</span><span class="plan-field-value">${planName}</span></div>
                    <div class="plan-field wide"><span class="plan-field-label">UID</span><span class="plan-field-value">${uid}</span></div>
                    <div class="plan-field"><span class="plan-field-label">Start Date</span><span class="plan-field-value">${formatPlanDate(plan.startDate)}</span></div>
                    <div class="plan-field"><span class="plan-field-label">End Date</span><span class="plan-field-value">${formatPlanDate(plan.endDate)}</span></div>
                    <div class="plan-field days-left"><span class="plan-field-label">Days Left</span><span class="plan-field-value">${daysLeft}</span></div>
                    <div class="plan-field"><span class="plan-field-label">Daily Likes</span><span class="plan-field-value">${likes.toLocaleString('en-IN')}</span><span class="plan-subvalue">Admin set quantity</span></div>
                </div>
            </div>`;
    }

    function fetchMyPlan(){ return; }

    // --- INIT ---
    setTimeout(() => hideLoader(), 2500);

    // Global safety net: a render/data error must never keep the full-screen loader visible.
    window.addEventListener('error', (event) => {
        console.error('Unhandled app error:', event.error || event.message);
        try { hideLoader(); } catch (_) {}
    });
    window.addEventListener('unhandledrejection', (event) => {
        console.error('Unhandled promise rejection:', event.reason);
        try { hideLoader(); } catch (_) {}
    });

    console.log('✅ NRZ STORE App initialized with enhanced security system');
</script>

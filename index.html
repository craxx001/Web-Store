<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>FF GLORY — Dashboard</title>
<style>
:root{--bg:#050a0f;--card:#11141a;--card2:#0d1117;--line:#1e2732;--blue:#2196ff;--blue2:#0b6fe8;--gold:#ffad17;--green:#23d477;--text:#f1f4f8;--muted:#758093;--danger:#ef5350}
*{box-sizing:border-box}html,body{margin:0;background:#02070b;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
body{min-height:100vh;background:radial-gradient(circle at 50% 20%,#0b2033 0,#061019 32%,#02070b 75%)}
.app{width:min(100%,720px);margin:auto;min-height:100vh;padding:14px 14px 100px}
.top{height:76px;border:1px solid #17304a;border-radius:25px;background:rgba(5,10,16,.88);display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 0 26px rgba(33,150,255,.08);position:sticky;top:10px;z-index:20;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}.brand-logo{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;border:1px solid #126bc3;background:radial-gradient(circle,#162f49,#02060a 65%);box-shadow:0 0 18px rgba(33,150,255,.28);font-size:17px}.brand b{color:#fff}.brand em{font-style:normal;color:#ff9813}.live{font-size:13px;color:#25d47b;font-weight:800}.live:before{content:'●';margin-right:5px;text-shadow:0 0 10px #25d47b}.top-actions{display:flex;gap:18px;font-size:25px}.iconbtn{background:none;border:0;color:#e9edf4;padding:5px}.section{margin-top:20px}.userbar{display:flex;gap:12px;align-items:center;justify-content:space-between}.pill{border:1px solid #183a5d;background:rgba(16,27,40,.8);border-radius:28px;padding:10px 15px;display:flex;align-items:center;gap:10px;color:#cfd6e0}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#122235;color:#2695ff;border:1px solid #175e9e;font-weight:700}.credits{color:#7d8796}.credits strong{color:#1e9bff;font-size:20px}.banner{margin-top:15px;border-radius:20px;overflow:hidden;border:1px solid #2a3440;min-height:155px;background:linear-gradient(135deg,#21190c,#06090c 52%,#1b1408);display:grid;place-items:center;box-shadow:0 0 28px rgba(255,171,22,.08)}.banner .art{font-size:30px;font-weight:1000;letter-spacing:2px;color:#e5a624;text-shadow:0 3px 0 #111,0 0 14px #ffb000;text-align:center;padding:25px}.banner small{display:block;color:#fff;font-size:12px;letter-spacing:1px;margin-top:10px}
label{display:block;color:#b5bfcd;font-size:14px;font-weight:700;margin:14px 3px 8px}.select,.field{width:100%;background:#0b0f14;border:1px solid #193a59;color:#eef2f7;border-radius:17px;padding:15px 17px;outline:none}.select{display:flex;justify-content:space-between;align-items:center}.card{background:rgba(16,19,25,.9);border:1px solid #1c232d;border-radius:25px;padding:22px;margin-top:18px;box-shadow:0 15px 40px rgba(0,0,0,.18)}.card h2{margin:0 0 16px;font-size:23px}.gold{color:var(--gold)}.blue{color:#2996ff}.muted{color:var(--muted)}
.plan{display:flex;align-items:center;gap:13px;border:1px solid #1768ad;background:#0d151e;border-radius:20px;padding:14px;box-shadow:0 0 18px rgba(33,150,255,.08)}.plan .bolt{font-size:23px;color:#2597ff}.plan .price{margin-left:auto;font-size:22px;font-weight:900;color:#ff9f17}.badge{font-size:12px;color:#ffb329;border:1px solid #80621f;border-radius:20px;padding:4px 9px;white-space:nowrap}.plan-title{font-weight:800;font-size:17px}.sub{font-size:13px;color:#6f7988;margin-top:3px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:900;color:#06101a;background:var(--blue);box-shadow:0 8px 25px rgba(33,150,255,.18)}.btn.goldbtn{background:#ffad17}.btn.full{width:100%}.btn.outline{background:transparent;color:#2d9bff;border:1px solid #176bb6}.btn.danger{color:#ff6868;border-color:#6b2225}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bot{border:1px solid #26313d;background:#0d1117;border-radius:20px;padding:15px;margin-top:12px}.bot-top{display:flex;justify-content:space-between;gap:10px}.status{font-size:11px;padding:4px 9px;border-radius:12px;background:#09281c;color:#39db83;border:1px solid #185e3c}.expired{background:#2b1718;color:#ff6d6d;border-color:#6a292b}.bot-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.smallbtn{padding:10px;border-radius:12px;background:#0b1118;color:#4ba7ff;border:1px solid #1b5f99}.smallbtn.red{color:#ff6464;border-color:#6d2227}
.bottom{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(calc(100% - 20px),690px);height:76px;border:1px solid #143957;border-radius:28px;background:rgba(6,11,17,.92);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(5,1fr);z-index:50;box-shadow:0 0 30px rgba(0,100,255,.15)}.nav{border:0;background:none;color:#738096;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav span:first-child{font-size:25px}.nav.active{color:#2698ff;text-shadow:0 0 13px rgba(33,150,255,.65)}.nav.goldactive{color:#ffb31b;text-shadow:0 0 13px rgba(255,179,27,.55)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 0 10px}.heroicon{width:84px;height:84px;border:1px solid #145b96;border-radius:25px;display:grid;place-items:center;color:#2597ff;font-size:43px;box-shadow:0 0 28px rgba(33,150,255,.18)}.region-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.region{border:1px solid #202731;background:#0e1218;border-radius:19px;padding:16px;text-align:left;color:#eef2f7}.region small{display:block;color:#737d8b;margin-top:5px}.region.liveRegion{border-color:#1268ad;box-shadow:0 0 20px rgba(33,150,255,.08)}
.transaction{padding:16px;border:1px solid #1d252e;border-radius:18px;margin-top:12px}.txline{display:flex;align-items:center;gap:10px}.num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#083524;color:#4df29a}.completed{margin-left:auto;color:#4be98e;border:1px solid #1c6746;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:900}.invoice{margin-top:12px;width:100%;padding:11px;background:#271f12;border:1px solid #6e531d;color:#ffbc25;border-radius:17px;font-weight:800}.couponbox{border:1px solid #60491b}.stepper{display:flex;gap:10px;align-items:center}.stepper button{width:55px;height:55px;border:0;border-radius:16px;background:#171c24;color:#aeb6c1;font-size:26px}.stepper .count{flex:1;text-align:center;font-size:23px;font-weight:800;background:#151920;padding:15px;border-radius:16px;color:#9da6b3}.contact-item{display:flex;gap:15px;align-items:center;padding:16px;border:1px solid #1d252e;border-radius:20px;margin-top:12px}.contact-icon{width:58px;height:58px;border-radius:18px;background:#10233a;color:#2899ff;display:grid;place-items:center;font-size:27px}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-end}.modal{width:min(100%,720px);margin:auto;background:#11141a;border-top:1px solid #222a34;padding:28px 25px 35px;border-radius:28px 28px 0 0}.modal.show{display:flex}.modalclose{float:right;width:42px;height:42px;border-radius:50%;background:#10151c;color:#bfc8d5;border:2px solid #1d74bb;font-size:25px}.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:#131a23;border:1px solid #24527a;color:#fff;padding:12px 16px;border-radius:14px;z-index:200;display:none;max-width:90%;text-align:center}.empty{text-align:center;color:#727d8c;padding:25px}
@media(max-width:430px){.app{padding-left:12px;padding-right:12px}.top{height:68px;padding:0 13px}.brand{font-size:18px}.brand-logo{width:38px;height:38px}.pill{font-size:13px;padding:8px 11px}.credits strong{font-size:16px}.card{padding:17px}.grid2{grid-template-columns:1fr}.region-grid{gap:9px}.region{padding:13px}.bottom{height:72px}.banner{min-height:135px}.banner .art{font-size:25px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modalBack" class="modalback"><div id="modal" class="modal"></div></div>
<div id="toast" class="toast"></div>
<script>
const state={page:'home',user:{name:'kamit5667',email:'kamit579960@gmail.com',credits:0},region:'India (₹)',bots:[{id:'3054833150',name:'U X A !!',region:'IND',status:'EXPIRED',credits:4,glory:'2351138488',created:'23/09/2026',uptime:'—'},{id:'FF-GLORY-01',name:'FF GLORY',region:'IND',status:'RUNNING',credits:4,glory:'—',created:'23/09/2026',uptime:'18h 45m'}],tx:[{amount:475,date:'21/09/2026, 18:01:03'},{amount:285,date:'21/09/2026, 14:23:01'},{amount:95,date:'19/09/2026, 20:29:20'}],coupons:[],likes:['India','Indonesia','Vietnam','Thailand','Bangladesh','Pakistan','Taiwan','Europe','Russia','North America','South America','Middle East']};
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function top(){return `<header class="top"><div class="brand"><div class="brand-logo">⚡</div><div><b>FF</b> <em>GLORY</em> <span class="live">LIVE</span></div></div><div class="top-actions"><button class="iconbtn" onclick="settings()">⚙</button><button class="iconbtn" onclick="logout()">⇥</button></div></header>`}
function home(){return `${top()}<section class="section"><div class="userbar"><div class="pill"><div class="avatar">K</div><b>${esc(state.user.name)}</b><span class="muted">(user)</span></div><div class="pill credits">🔵 ▤ &nbsp; Credits: <strong>${state.user.credits}</strong></div></div><div class="banner"><div class="art">BBC MOD IS LIVE<small>ONE MOD • ENDLESS ADVANTAGE • BETTER ACCURACY • FASTER REACTION</small></div></div><label>🌐 Server Region</label><button class="select" onclick="regionPicker()"><span>🇮🇳 ${state.region}</span><span>⌄</span></button><div class="card"><h2>🛒 Buy Credits</h2><div class="plan" onclick="buyCredits()"><div class="bolt">ϟ</div><div><div class="plan-title">4 GLORY BOTS <span class="badge">1 SQUAD</span></div><div class="sub">Basic Credit • 1 Prime Squad</div></div><div class="price">₹95</div></div></div><div class="card"><h2>🚀 Launch <span class="gold">Bot</span></h2><label>♢ Guild ID</label><input id="guild" class="field" placeholder="👥  Enter your Guild ID"/><label>Select Server</label><button class="select" onclick="regionPicker()"><span>🇮🇳 ${state.region}</span><span>⌄</span></button><div class="sub" style="margin:10px 0">Available: ${state.user.credits} credits</div><button class="btn full" onclick="launchBot()">▣ &nbsp; BUY CREDITS TO LAUNCH BOTS</button></div><div class="section"><h2>〽 Bot Instances</h2>${state.bots.map(botCard).join('')}</div></section>`}
function botCard(b){return `<div class="bot"><div class="bot-top"><div><b>● ${esc(b.name)}</b> <span class="muted">#${esc(b.id)}</span><div class="sub">🇮🇳 ${b.region} • ${b.credits} BOTS</div></div><span class="status ${b.status==='EXPIRED'?'expired':''}">${b.status}</span></div><div class="sub" style="margin-top:9px">⚡ ${b.credits} bots • Basic • 1 Prime Squad<br>◷ Uptime: ${b.uptime}<br>Created: ${b.created}</div><div class="bot-actions"><button class="smallbtn" onclick="refund('${esc(b.id)}')">↩ Refund</button><button class="smallbtn red" onclick="delBot('${esc(b.id)}')">♜ Delete</button></div></div>`}
function likes(){return `${top()}<div class="center"><div class="heroicon">ϟ</div><h1>FF <span class="gold">GLORY</span> <span class="blue">AUTOLIKE</span></h1><p class="muted">Buy autolike directly on our <b class="blue">Telegram</b></p><u class="muted">Terms & Conditions</u></div><div class="region-grid">${state.likes.map((r,i)=>`<button class="region ${i===0?'liveRegion':''}" onclick="likeRegion('${r}')">🌐 <b>${flag(r)} ${r}</b>${i===0?'<span class="badge" style="float:right">LIVE</span>':''}<small>Buy on Telegram →</small></button>`).join('')}</div>`}
function history(){return `${top()}<div class="card"><h2>🧾 Transactions <button class="btn outline" style="float:right;padding:9px 13px" onclick="toast('Transactions refreshed')">⟳ Refresh</button></h2>${state.tx.map((t,i)=>`<div class="transaction"><div class="txline"><div class="num">${i+1}</div><div><b>₹${t.amount} → <span class="blue">1 prime squad</span></b><div class="sub">${t.date}</div></div><span class="completed">COMPLETED</span></div><button class="invoice" onclick="invoice(${i})">⇩ &nbsp; Download Invoice (Invoice + POD + Consent + Usage Log)</button></div>`).join('')}</div><div class="card"><h2>🚀 Bot Launches <span class="badge" style="float:right">${state.bots.length}</span></h2>${state.bots.map(botCard).join('')}</div>`}
function coupons(){return `${top()}<div class="card"><h2 class="gold">🎟 Gift Coupons <button class="btn outline" style="float:right;padding:9px 13px" onclick="toast('Coupons refreshed')">⟳ Refresh</button></h2><div class="card couponbox"><h2 class="gold">🎁 Redeem a Coupon</h2><p class="muted">Enter a coupon code to receive credits</p><input id="coupon" class="field" placeholder="XXXX-XXXX-XXXX"/><button class="btn goldbtn full" style="margin-top:12px" onclick="redeem()">✓ &nbsp; Redeem</button></div><div class="card"><h2>＋ Create a Coupon</h2><p class="muted">Convert your credits into a shareable coupon</p><div class="credits">🔵 CREDITS <span style="float:right">Available: <b class="blue">${state.user.credits}</b></span></div><div class="stepper" style="margin-top:12px"><button onclick="step(-1)">−</button><div id="count" class="count">1</div><button onclick="step(1)">＋</button></div><button class="btn full" style="margin-top:12px" onclick="createCoupon()">🎟 &nbsp; ${state.user.credits?'Create Coupon':'No Credits Available'}</button></div><div class="card"><h2>◷ Coupon History</h2>${state.coupons.length?state.coupons.map(c=>`<div class="transaction"><b>${c}</b><div class="sub">Created just now</div></div>`).join(''):'<div class="empty">No coupon history yet.</div>'}</div></div>`}
function contact(){return `${top()}<div class="card center"><div class="heroicon">▢</div><h1>Contact Us</h1><p class="muted">Reach out for orders, support, or any questions</p><div style="width:100%;text-align:left"><div class="contact-item" onclick="openLink('https://t.me/bigbullcheat')"><div class="contact-icon">➤</div><div><h3>Telegram Channel</h3><span class="muted">@bigbullcheat — Updates & announcements</span></div></div><div class="contact-item" onclick="openLink('https://t.me/ffgloryofc')"><div class="contact-icon">📣</div><div><h3>Update Channel <span class="badge">OFFICIAL</span></h3><span class="muted">@ffgloryofc — Latest news & updates</span></div></div><div class="contact-item" style="border-color:#6e531d" onclick="openLink('https://t.me/ffgloryindia')"><div class="contact-icon" style="background:#2b2110;color:#ffad17">▱</div><div><h3>Contact Admin</h3><span class="muted">@ffgloryindia — Quick help & orders</span></div></div></div></div>`}
function flag(r){return ({India:'🇮🇳',Indonesia:'🇮🇩',Vietnam:'🇻🇳',Thailand:'🇹🇭',Bangladesh:'🇧🇩',Pakistan:'🇵🇰',Taiwan:'🇹🇼',Europe:'🇪🇺',Russia:'🇷🇺','North America':'🇺🇸','South America':'🌎','Middle East':'🕌'})[r]||'🌐'}
function nav(){return `<nav class="bottom"><button class="nav ${state.page==='history'?'active':''}" onclick="go('history')"><span>▣</span>History</button><button class="nav ${state.page==='coupons'?'active':''}" onclick="go('coupons')"><span>🎁</span>Coupons</button><button class="nav ${state.page==='home'?'active':''}" onclick="go('home')"><span>⚡</span>Home</button><button class="nav ${state.page==='likes'?'goldactive':''}" onclick="go('likes')"><span>♕</span>Likes</button><button class="nav ${state.page==='contact'?'active':''}" onclick="go('contact')"><span>▢</span>Contact</button></nav>`}
function render(){app.innerHTML=({home,likes,history,coupons,contact}[state.page])()+nav()}
function go(p){state.page=p;render();scrollTo(0,0)}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display='none',2200)}
function settings(){document.getElementById('modal').innerHTML=`<button class="modalclose" onclick="closeModal()">×</button><h2>⚙ Settings</h2><p><span class="muted">Email</span><span style="float:right">${esc(state.user.email)}</span></p><p><span class="muted">Username</span><span style="float:right">${esc(state.user.name)}</span></p><p><span class="muted">Credits</span><b class="blue" style="float:right">${state.user.credits}</b></p>`;document.getElementById('modalBack').style.display='flex'}
function closeModal(){document.getElementById('modalBack').style.display='none'}
function regionPicker(){document.getElementById('modal').innerHTML=`<button class="modalclose" onclick="closeModal()">×</button><h2>🌐 Select Server Region</h2>${['India (₹)','Indonesia','Vietnam','Thailand','Bangladesh','Pakistan'].map(r=>`<button class="region" style="width:100%;margin-top:9px" onclick="state.region='${r}';closeModal();render()">${flag(r.split(' ')[0])} ${r}</button>`).join('')}`;document.getElementById('modalBack').style.display='flex'}
function buyCredits(){state.user.credits+=4;state.tx.unshift({amount:95,date:new Date().toLocaleString('en-IN')});toast('Demo purchase complete: +4 credits');render()}
function launchBot(){const g=document.getElementById('guild')?.value.trim();if(!g)return toast('Please enter Guild ID');if(state.user.credits<4)return toast('Not enough credits. Buy credits first.');state.user.credits-=4;state.bots.push({id:g,name:'FF GLORY',region:'IND',status:'RUNNING',credits:4,glory:'—',created:new Date().toLocaleDateString('en-GB'),uptime:'0m'});toast('Bot launched successfully');render()}
function delBot(id){state.bots=state.bots.filter(b=>b.id!==id);toast('Bot deleted');render()}
function refund(id){state.user.credits+=4;state.bots=state.bots.filter(b=>b.id!==id);toast('Refunded 4 credits');render()}
function likeRegion(r){openLink('https://t.me/ffgloryofc');toast('Opening Telegram for '+r)}
function openLink(u){window.open(u,'_blank','noopener,noreferrer')}
function invoice(i){toast('Demo invoice generated for transaction #'+(i+1))}
function redeem(){const c=document.getElementById('coupon').value.trim();if(!c)return toast('Enter a coupon code');if(c.length<6)return toast('Invalid coupon code');state.user.credits+=4;toast('Coupon redeemed: +4 credits');render()}
let couponCount=1;function step(n){couponCount=Math.max(1,couponCount+n);document.getElementById('count').textContent=couponCount}
function createCoupon(){if(state.user.credits<couponCount)return toast('No credits available');state.user.credits-=couponCount;const c='FFG-'+Math.random().toString(36).slice(2,10).toUpperCase();state.coupons.unshift(c);toast('Coupon created: '+c);render()}
function logout(){toast('Demo logout clicked')}
render();
</script>
</body>
</html>
